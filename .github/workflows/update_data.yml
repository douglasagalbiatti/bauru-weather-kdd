name: Atualização Automática de Dados Meteorológicos (KDD)

on:
  # 1. Execução diária programada às 06:00 UTC (03:00 no fuso de Brasília)
  schedule:
    - cron: '0 6 * * *'

  # 2. Permite disparar manualmente pelo botão "Run workflow" no GitHub
  workflow_dispatch:

# Permissão explícita para que o robô faça commit e push de volta no repositório
permissions:
  contents: write

jobs:
  update-weather-data:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout do Repositório
        uses: actions/checkout@v4

      - name: 2. Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. Instalar Dependências do Projeto
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Executar Sincronização Incremental (Open-Meteo)
        run: |
          python src/update_weather.py

      - name: 5. Verificar e Comitar Novos Dados
        run: |
          # Verifica se algum arquivo em data/ ou reports/ foi modificado
          if [ -n "$(git status --porcelain data/ reports/)" ]; then
            echo "Novos dados detectados! Gravando commit..."
            git config --local user.name "github-actions[bot]"
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git add data/ reports/
            git commit -m "chore(data): atualizacao automatica dos dados meteorologicos [skip ci]"
            git push
          else
            echo "Nenhum dado novo a comitar. A base já estava atualizada."
          fi
