name: Coleta da Estação IPMet / UNESP Bauru (runner no Brasil)

# O site do IPMet só responde a IPs brasileiros. Os runners hospedados do GitHub
# (ubuntu-latest) ficam nos EUA, por isso este workflow roda num self-hosted runner
# instalado numa máquina no Brasil, registrado com o rótulo "ipmet-br".

on:
  schedule:
    # A cada 30 minutos (o GitHub pode atrasar execuções agendadas em alguns minutos)
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# Nunca duas coletas ao mesmo tempo (evita conflito de push)
concurrency:
  group: ipmet-collector
  cancel-in-progress: false

jobs:
  collect-ipmet:
    runs-on: [self-hosted, linux]
    timeout-minutes: 10

    steps:
      - name: 1. Checkout do Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Preparar ambiente Python (venv persistente no runner)
        run: |
          VENV="${RUNNER_TOOL_CACHE:-$HOME/.cache}/ipmet-venv"
          if [ ! -x "$VENV/bin/python" ]; then
            python3 -m venv "$VENV"
            "$VENV/bin/pip" install --quiet --upgrade pip
          fi
          "$VENV/bin/pip" install --quiet requests
          echo "IPMET_PYTHON=$VENV/bin/python" >> "$GITHUB_ENV"

      - name: 3. Capturar leitura da estação IPMet
        run: |
          "$IPMET_PYTHON" src/update_ipmet.py

      - name: 4. Comitar leitura nova
        run: |
          if [ -z "$(git status --porcelain data/interim/ipmet_latest.json data/raw/ipmet/)" ]; then
            echo "Nenhuma leitura nova a comitar."
            exit 0
          fi
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/interim/ipmet_latest.json data/raw/ipmet/
          git commit -m "chore(data): leitura da estacao IPMet Bauru [skip ci]"
          # Tenta algumas vezes, caso o workflow diário tenha feito push no meio tempo
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 10
          done
          echo "Falha ao enviar o commit após 3 tentativas."
          exit 1
